<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digestive System Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Digestive System Explorer</h1><p class="subtitle">Hover over a part name to highlight it.</p></header>
<main>
<section id="level1">
  <div class="explorer-grid" id="explorerGrid">
    <svg id="connectorLayer" class="connector-layer" aria-hidden="true"><g id="connectorLines"></g></svg>
    <aside class="parts-panel" id="leftParts"></aside>
    <section class="diagram-card digestive-stage"><img id="wholeImage" class="whole-image" src="assets/digestive-system/0_whole.svg" alt="Whole digestive system"><img id="digestiveHighlight" class="digestive-highlight" src="" alt="" aria-hidden="true"></section>
    <aside class="parts-panel" id="rightParts"></aside>
  </div>
  <div class="mobile-parts" id="mobileParts"></div>
  <button class="primary-btn" id="startChallengeBtn">Start Challenge</button>
</section>
<section id="level2" hidden>
  <h2>Challenge Mode</h2><p>Drag each name to its correct numbered position.</p>
  <div class="word-bank" id="wordBank"></div>
  <div class="challenge-layout">
    <svg id="challengeConnectorLayer" class="challenge-connector-layer" aria-hidden="true"><g id="challengeConnectorLines"></g></svg>
    <div class="slots challenge-slots challenge-slots-left" id="challengeLeftSlots"></div>
    <div class="diagram-card challenge-diagram-card"><div class="challenge-image-stack"><img id="challengeImage" src="assets/digestive-system/0_whole.svg" alt="Whole digestive system"><img id="challengeHighlightImage" class="challenge-highlight-image" src="" alt="" aria-hidden="true"></div></div>
    <div class="slots challenge-slots challenge-slots-right" id="challengeRightSlots"></div>
  </div>
  <p id="challengeFeedback" class="feedback"></p>
  <div class="controls"><button id="checkAnswersBtn">Check Answers</button><button id="resetIncorrectBtn" type="button">RESET INCORRECT</button><button id="resetAllBtn">Reset All</button><button id="startExamBtn">Start Exam</button><button id="backToExploreBtn">Back</button></div>
</section>
<section id="level3" hidden>
 <div class="exam-container"><h2>Digestive System Exam</h2><div class="exam-progress-bar"><div id="examProgressFill"></div></div><p id="examProgressText"></p><div id="examQuestion" class="exam-question"></div><div id="examOptions" class="exam-options"></div><div id="examFeedback" class="feedback"></div><div class="controls"><button id="backToChallengeBtn">Back</button><button id="nextQuestionBtn">Next Question</button></div></div>
</section>
</main>
<div id="partTooltip"></div>
<div id="winModal" class="win-modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="win-box">
    <h2 id="winTitle">Congratulations!</h2>
    <p>You have successfully completed the activity.</p>
    <button id="playAgainBtn" type="button">Play Again</button>
    <button id="closeModalBtn" type="button">Close</button>
  </div>
</div>
<script src="app.js"></script>
</body></html>

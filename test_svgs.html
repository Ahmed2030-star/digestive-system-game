<!DOCTYPE html>
<html>
<head><title>SVG Validation Test</title></head>
<body>
<h1>SVG Validation Test</h1>
<div id="results"></div>
<script>
const files = [
  '3_Anther_Highlight.svg',
  '4_Filament_Highlight.svg', 
  '5_Stigma_Highlight.svg',
  '6_Style_Highlight.svg',
  '7_Ovary_Highlight.svg',
  '8_Ovule_Highlight.svg',
  '9_Sepal_Highlight.svg',
  '10_Petal_Highlight.svg'
];

const results = document.getElementById('results');

async function testSVG(filename) {
  try {
    const response = await fetch('assets/' + filename);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'image/svg+xml');
    const errors = doc.querySelectorAll('parsererror');
    if (errors.length > 0) {
      return { file: filename, valid: false, error: errors[0].textContent };
    }
    const svg = doc.querySelector('svg');
    return { file: filename, valid: true, width: svg?.getAttribute('width'), height: svg?.getAttribute('height'), viewBox: svg?.getAttribute('viewBox') };
  } catch (e) {
    return { file: filename, valid: false, error: e.message };
  }
}

async function runTests() {
  for (const f of files) {
    const result = await testSVG(f);
    const div = document.createElement('div');
    div.style.margin = '10px';
    div.style.padding = '10px';
    div.style.border = result.valid ? '2px solid green' : '2px solid red';
    div.innerHTML = '<strong>' + f + '</strong>: ' + (result.valid ? '✓ VALID' : '✗ INVALID') + (result.error ? ' - ' + result.error : '');
    results.appendChild(div);
  }
}

runTests();
</script>
</body>
</html>
